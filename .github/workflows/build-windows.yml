name: Build Windows installer

# Runs on every push to main, on a tag such as v2.0.1 (which also makes a public Release), and by hand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: python -m pip install -c packaging/build-constraints.txt PySide6-Essentials Pillow pyinstaller

      - name: Read the version
        id: ver
        shell: bash
        run: echo "version=$(python -c "from src.version import VERSION; print(VERSION)")" >> "$GITHUB_OUTPUT"

      - name: Make the program icon
        run: python packaging/make_icon.py

      - name: Package the program (PyInstaller)
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/RunSpriteRun.spec

      - name: Check the packaged program starts
        shell: bash
        run: |
          test -f dist/RunSpriteRun/RunSpriteRun.exe
          test -d dist/RunSpriteRun/_internal/src/app/assets

      - name: Make sure Inno Setup is present
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\RunSpriteRun.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: RunSpriteRun_Setup_v${{ steps.ver.outputs.version }}
          path: dist_installer/*.exe

      - name: Publish a Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/*.exe
